name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify-and-build:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.19.0'
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.25.0 --activate
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Validate
        run: pnpm tokens:validate && pnpm tokens:check && pnpm content:validate && pnpm lint && pnpm test
      - name: Build
        run: pnpm build
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: verify-and-build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
      - name: Verify deployed provenance
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          provenance_url="${PAGE_URL%/}/provenance.json"
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --location --header 'Cache-Control: no-cache' "$provenance_url" -o provenance.json; then
              if node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('provenance.json','utf8')); if (p.schemaVersion !== 1 || p.designSha !== process.env.EXPECTED_SHA) process.exit(1)"; then
                cat provenance.json
                exit 0
              fi
            fi
            sleep 10
          done
          echo "deployed Pages provenance did not match expected commit $EXPECTED_SHA" >&2
          cat provenance.json 2>/dev/null || true
          exit 1
