name: design conformance

on:
  workflow_call:

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout consumer exact commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.sha }}
      - name: Checkout exact design workflow revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: KAFKA2306/design
          ref: ${{ github.workflow_sha }}
          path: .kafka-design-source
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.19.0'
      - name: Verify consumer against pinned design revision
        run: node .kafka-design-source/scripts/design-conformance.mjs --consumer "$GITHUB_WORKSPACE" --format json
