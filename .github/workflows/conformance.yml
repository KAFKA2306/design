name: design conformance

on:
  workflow_call:
    inputs:
      consumer_path:
        description: Path containing design.config.json and design.lock.json
        required: false
        type: string
        default: .

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    env:
      CONSUMER_PATH: ${{ inputs.consumer_path }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.19.0'
      - name: Verify managed design adoption
        shell: bash
        run: |
          set -euo pipefail
          test -f "$CONSUMER_PATH/design.config.json"
          test -f "$CONSUMER_PATH/design.lock.json"
          test -f "$CONSUMER_PATH/.kafka-design/portable-conformance.mjs"
          node "$CONSUMER_PATH/.kafka-design/portable-conformance.mjs" --consumer "$CONSUMER_PATH"
