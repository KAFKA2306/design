name: registry

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  registry:
    runs-on: ubuntu-latest
    env:
      EXACT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      SHADCN_VERSION: 4.19.0
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact checkout
        run: test "$(git rev-parse HEAD)" = "$EXACT_SHA"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.19.0'
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.25.0 --activate
      - name: Install design repo
        run: pnpm install --frozen-lockfile
      - name: Test local registry contract
        run: pnpm test
      - name: Validate exact local source registry
        run: pnpm dlx shadcn@${SHADCN_VERSION} registry validate ./registry.json
      - name: Build exact local registry
        run: |
          rm -rf .registry-build
          pnpm dlx shadcn@${SHADCN_VERSION} build registry.json --output .registry-build
          test -f .registry-build/kafka-base.json
          test -f .registry-build/kafka-button.json
          test -f .registry-build/kafka-input.json
          test -f .registry-build/kafka-dialog.json
          test -f .registry-build/kafka-tabs.json
      - name: View built registry items
        run: |
          pnpm dlx shadcn@${SHADCN_VERSION} view ./.registry-build/kafka-base.json
          pnpm dlx shadcn@${SHADCN_VERSION} view ./.registry-build/kafka-button.json
          pnpm dlx shadcn@${SHADCN_VERSION} view ./.registry-build/kafka-input.json
          pnpm dlx shadcn@${SHADCN_VERSION} view ./.registry-build/kafka-dialog.json
          pnpm dlx shadcn@${SHADCN_VERSION} view ./.registry-build/kafka-tabs.json
      - name: Install initialized clean consumer dependencies
        run: |
          test -f fixtures/registry-consumer/components.json
          pnpm --dir fixtures/registry-consumer install --lockfile=false
      - name: Install kafka-base
        run: pnpm dlx shadcn@${SHADCN_VERSION} add "$GITHUB_WORKSPACE/.registry-build/kafka-base.json" --yes --cwd fixtures/registry-consumer
      - name: Dry-run Core UI install
        run: |
          pnpm dlx shadcn@${SHADCN_VERSION} add \
            "$GITHUB_WORKSPACE/.registry-build/kafka-button.json" \
            "$GITHUB_WORKSPACE/.registry-build/kafka-input.json" \
            "$GITHUB_WORKSPACE/.registry-build/kafka-dialog.json" \
            "$GITHUB_WORKSPACE/.registry-build/kafka-tabs.json" \
            --dry-run --cwd fixtures/registry-consumer
      - name: Install Core UI
        run: |
          pnpm dlx shadcn@${SHADCN_VERSION} add \
            "$GITHUB_WORKSPACE/.registry-build/kafka-button.json" \
            "$GITHUB_WORKSPACE/.registry-build/kafka-input.json" \
            "$GITHUB_WORKSPACE/.registry-build/kafka-dialog.json" \
            "$GITHUB_WORKSPACE/.registry-build/kafka-tabs.json" \
            --yes --cwd fixtures/registry-consumer
      - name: Verify installed authority
        run: |
          test -f fixtures/registry-consumer/src/styles/kafka-tokens.css
          test -f fixtures/registry-consumer/src/styles/kafka-globals.css
          test -f fixtures/registry-consumer/src/styles/kafka-components.css
          test -f fixtures/registry-consumer/src/components/ui/button.tsx
          test -f fixtures/registry-consumer/src/components/ui/input.tsx
          test -f fixtures/registry-consumer/src/components/ui/dialog.tsx
          test -f fixtures/registry-consumer/src/components/ui/tabs.tsx
          grep -F '@import "./styles/kafka-tokens.css"' fixtures/registry-consumer/src/index.css
          grep -F '@import "./styles/kafka-globals.css"' fixtures/registry-consumer/src/index.css
          grep -F '@import "./styles/kafka-components.css"' fixtures/registry-consumer/src/index.css
          grep -F '"style": "base-nova"' fixtures/registry-consumer/components.json
          grep -F '"iconLibrary": "lucide"' fixtures/registry-consumer/components.json
          node -e "const p=require('./fixtures/registry-consumer/package.json'); if(p.dependencies?.['@base-ui/react']!=='1.7.0') throw new Error('expected @base-ui/react 1.7.0, got '+p.dependencies?.['@base-ui/react'])"
          test ! -e fixtures/registry-consumer/tokens/foundation.tokens.json
      - name: Build installed consumer
        run: pnpm --dir fixtures/registry-consumer build
